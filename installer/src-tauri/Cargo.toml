[package]
name = "vivestream-next-setup"
version = "3.8.0"
description = "Immersive Setup Installer for ViveStream Next"
authors = ["LocalGhost"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "2.1"
dirs-next = "2.0"
winreg = "0.52"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
