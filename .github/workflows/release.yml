name: Release
run-name: "ViveStream Release ${{ github.ref_name || inputs.tag || '' }}"

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. 1.8.6 or v1.8.6). If omitted, auto-reads from project version files."
        required: false
        type: string
      previous_tag:
        description: "Previous tag to calculate changelog from (e.g., v1.8.5). If omitted, auto-detects."
        required: false
        type: string
      draft:
        description: "Publish as a draft release?"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Mark as a pre-release?"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # ============================================================================
  # STAGE 1: PREPARE RELEASE (Single runner - ensures zero race conditions)
  # ============================================================================
  prepare:
    name: Prepare Release & Changelog
    runs-on: ubuntu-22.04
    outputs:
      app_version: ${{ steps.version_check.outputs.app_version }}
      tag_name: ${{ steps.version_check.outputs.tag_name }}
      release_body: ${{ steps.generate_notes.outputs.release_body }}
      is_draft: ${{ steps.release_config.outputs.is_draft }}
      is_prerelease: ${{ steps.release_config.outputs.is_prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify Version Synchronization
        id: version_check
        shell: bash
        run: |
          bun run ./scripts/verify-versions.js

          VERSION=$(cat VERSION | tr -d '\n\r ')
          INPUT_TAG="${{ github.event.inputs.tag }}"

          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            CLEAN_INPUT_TAG="${INPUT_TAG#v}"
            if [ "$CLEAN_INPUT_TAG" != "$VERSION" ]; then
              echo "::error::Manual input tag ($CLEAN_INPUT_TAG) does not match codebase version ($VERSION). Aborting."
              exit 1
            fi
          fi

          TAG_NAME="v$VERSION"
          echo "app_version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Configure Release Flags
        id: release_config
        shell: bash
        run: |
          DRAFT="${{ github.event_name == 'workflow_dispatch' && inputs.draft || 'false' }}"
          PRERELEASE="${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || 'false' }}"
          echo "is_draft=$DRAFT" >> $GITHUB_OUTPUT
          echo "is_prerelease=$PRERELEASE" >> $GITHUB_OUTPUT

      - name: Ensure Git Tag Exists
        shell: bash
        run: |
          TAG_NAME="${{ steps.version_check.outputs.tag_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Creating git tag: $TAG_NAME"
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "$TAG_NAME" || echo "Tag already pushed on remote."
          else
            echo "Tag $TAG_NAME already exists."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Rich Changelog Notes
        id: generate_notes
        shell: bash
        run: |
          git fetch --tags --force || true
          VERSION="${{ steps.version_check.outputs.app_version }}"
          INPUT_PREV_TAG="${{ github.event.inputs.previous_tag }}"

          if [ -n "$INPUT_PREV_TAG" ]; then
            PREV_TAG="$INPUT_PREV_TAG"
          else
            PREV_TAG=$(git describe --tags --abbrev=0 "v$VERSION^" 2>/dev/null || git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          fi

          if [ -n "$PREV_TAG" ] && git rev-parse --verify "$PREV_TAG" >/dev/null 2>&1; then
            LOG_RANGE="$PREV_TAG..HEAD"
          else
            LOG_RANGE="-n 30"
            PREV_TAG=""
          fi

          FEAT_LOG=""
          FIX_LOG=""
          UI_LOG=""
          PERF_LOG=""
          OTHER_LOG=""

          while IFS=$'\t' read -r hash subject; do
            [ -z "$hash" ] && continue
            commit_line="- ${subject} (\`${hash}\`)"
            
            case "$subject" in
              feat*|Feat*|add*|Add*)
                FEAT_LOG="${FEAT_LOG}${commit_line}"$'\n'
                ;;
              fix*|Fix*|bug*|Bug*|patch*|Patch*)
                FIX_LOG="${FIX_LOG}${commit_line}"$'\n'
                ;;
              ui*|UI*|style*|Style*|css*|CSS*|design*|Design*)
                UI_LOG="${UI_LOG}${commit_line}"$'\n'
                ;;
              perf*|Perf*|refactor*|Refactor*|core*|Core*|engine*|Engine*)
                PERF_LOG="${PERF_LOG}${commit_line}"$'\n'
                ;;
              *)
                OTHER_LOG="${OTHER_LOG}${commit_line}"$'\n'
                ;;
            esac
          done < <(git log $LOG_RANGE --pretty=format:"%h%x09%s")

          if [ -z "$FEAT_LOG" ] && [ -z "$FIX_LOG" ] && [ -z "$UI_LOG" ] && [ -z "$PERF_LOG" ]; then
            OTHER_LOG=$(git log $LOG_RANGE --pretty=format:"- %s (\`%h\`)")$'\n'
          fi

          RELEASE_BODY_FILE=$(mktemp)

          {
            echo "# 🚀 ViveStream Next \`v${VERSION}\`"
            echo ""
            echo "> *A lightning-fast, native YouTube downloader & sleek local media library.* 🎬✨"
            if [ -n "$PREV_TAG" ]; then
              echo ""
              echo "> 🔍 *Changelog calculated since tag \`${PREV_TAG}\`*"
            fi
            echo ""
            echo "---"
            echo ""
            echo "## 📦 What's New in this Release"
            echo ""
            if [ -n "$FEAT_LOG" ]; then
              echo "### ✨ Features & Enhancements"
              echo "$FEAT_LOG"
            fi
            if [ -n "$FIX_LOG" ]; then
              echo "### 🐛 Bug Fixes & Improvements"
              echo "$FIX_LOG"
            fi
            if [ -n "$UI_LOG" ]; then
              echo "### 🎨 UI & Aesthetics Polish"
              echo "$UI_LOG"
            fi
            if [ -n "$PERF_LOG" ]; then
              echo "### ⚡ Performance & Core Engine"
              echo "$PERF_LOG"
            fi
            if [ -n "$OTHER_LOG" ]; then
              echo "### 🛠️ Other Changes & Maintenance"
              echo "$OTHER_LOG"
            fi
            echo "---"
            echo ""
            echo "## 💻 Installation & Downloads"
            echo ""
            echo "| Platform | Package | Architecture |"
            echo "| :--- | :--- | :--- |"
            echo "| **🪟 Windows** | \`vivestream-next_${VERSION}_x64-setup.exe\` | \`x86_64\` |"
            echo "| **🐧 Linux (Debian/Ubuntu)** | \`vivestream-next_${VERSION}_amd64.deb\` | \`x86_64\` |"
            echo "| **🐧 Arch Linux** | \`vivestream-next_${VERSION}_x86_64.pkg.tar.zst\` | \`x86_64\` |"
            echo ""
            echo "---"
            echo ""
            echo "> [!TIP]"
            echo "> ### 🛡️ Security Notice (Unknown Publisher)"
            echo "> **ViveStream** is a non-commercial open-source project. We do not purchase expensive enterprise code-signing certificates. Your operating system may flag the installer as coming from an *Unknown Publisher*."
            echo ">"
            echo "> - **🪟 Windows**: Click **\"More Info\"** ➔ **\"Run Anyway\"** if Microsoft Defender SmartScreen prompts."
            echo "> - **🐧 Linux**: Right-click the binary ➔ *Properties* ➔ check **\"Allow executing file as program\"** (or \`chmod +x\`)."
            echo ""
            echo "---"
            echo ""
            echo "⌨️ **Pro Tip**: Press <kbd>?</kbd> anywhere in the app to open the interactive **Keyboard Shortcuts Cheat Sheet**! ⭐ If you like ViveStream, consider giving us a star on GitHub!"
          } > "$RELEASE_BODY_FILE"

          cp "$RELEASE_BODY_FILE" RELEASE_NOTES.md

          EOF_DELIMITER="DELIMITER_$(date +%s)"
          echo "release_body<<$EOF_DELIMITER" >> "$GITHUB_OUTPUT"
          cat "$RELEASE_BODY_FILE" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "$EOF_DELIMITER" >> "$GITHUB_OUTPUT"
          rm -f "$RELEASE_BODY_FILE"

      - name: Create Draft GitHub Release
        shell: bash
        run: |
          TAG_NAME="${{ steps.version_check.outputs.tag_name }}"
          VERSION="${{ steps.version_check.outputs.app_version }}"
          IS_PRERELEASE="${{ steps.release_config.outputs.is_prerelease }}"

          PRERELEASE_FLAG=""
          if [ "$IS_PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists, updating release notes..."
            gh release edit "$TAG_NAME" --title "ViveStream v$VERSION" --notes-file RELEASE_NOTES.md $PRERELEASE_FLAG
          else
            echo "Creating draft release for $TAG_NAME..."
            gh release create "$TAG_NAME" --title "ViveStream v$VERSION" --notes-file RELEASE_NOTES.md --draft $PRERELEASE_FLAG
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # STAGE 2: BUILD APP MATRIX (Linux & Windows)
  # ============================================================================
  build:
    name: Build App (${{ matrix.os }})
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config libglib2.0-dev patchelf squashfs-tools libfuse2 binutils zstd tar

      - name: Install frontend dependencies
        run: bun install

      - name: Build Tauri Bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.prepare.outputs.tag_name }}
          releaseName: "ViveStream v${{ needs.prepare.outputs.app_version }}"
          releaseDraft: true
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}

      - name: Generate & Upload Arch Linux Package (.pkg.tar.zst)
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          DEB_FILE=$(find src-tauri/target/release/bundle/deb -name "*.deb" | head -n 1)
          if [ -z "$DEB_FILE" ]; then
            echo "::error::.deb package not found. Cannot generate Arch package."
            exit 1
          fi

          echo "Generating Arch package from $DEB_FILE..."
          mkdir arch_build
          cd arch_build
          ar x "../$DEB_FILE"
          tar -xf data.tar.*
          rm -f control.tar.* data.tar.* debian-binary

          SIZE=$(du -sb . | awk '{print $1}')

          printf "%s\n" \
            "pkgname = vivestream-next-bin" \
            "pkgbase = vivestream-next-bin" \
            "pkgver = ${{ needs.prepare.outputs.app_version }}-1" \
            "pkgdesc = A lightning-fast, natively integrated YouTube downloader and local media library." \
            "url = https://github.com/rootlocalghost/ViveStream-Next" \
            "builddate = $(date +%s)" \
            "packager = ViveStream CI <noreply@github.com>" \
            "size = $SIZE" \
            "arch = x86_64" \
            "license = custom:PolyForm Noncommercial 1.0.0" \
            "depend = webkit2gtk-4.1" \
            "depend = gst-plugins-good" \
            "depend = gst-plugins-base" \
            "depend = gst-plugins-bad" \
            "depend = gst-plugins-ugly" \
            "depend = gst-libav" \
            "depend = yt-dlp" \
            "depend = ffmpeg" \
            "depend = intel-media-driver" \
            "depend = libva-utils" \
            "provides = vivestream-next" \
            "conflict = vivestream-next" > .PKGINFO

          ARCH_PKG_NAME="vivestream-next_${{ needs.prepare.outputs.app_version }}_x86_64.pkg.tar.zst"
          tar --owner=0 --group=0 --numeric-owner -c --zstd -f "../$ARCH_PKG_NAME" .PKGINFO usr

          gh release upload ${{ needs.prepare.outputs.tag_name }} "../$ARCH_PKG_NAME" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest Build Provenance (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        timeout-minutes: 5
        with:
          subject-path: |
            src-tauri/target/release/bundle/deb/*.deb
            *.pkg.tar.zst

      - name: Attest Build Provenance (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        timeout-minutes: 5
        with:
          subject-path: "src-tauri/target/release/bundle/nsis/*.exe"

  # ============================================================================
  # STAGE 3: PUBLISH RELEASE (Undrafts when all matrix builds succeed)
  # ============================================================================
  publish:
    name: Publish Release
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    if: needs.prepare.outputs.is_draft == 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Undraft and Publish Release
        shell: bash
        run: |
          TAG_NAME="${{ needs.prepare.outputs.tag_name }}"
          echo "Publishing release: $TAG_NAME"
          gh release edit "$TAG_NAME" --draft=false
          echo "🎉 Release published successfully!"
          gh release view "$TAG_NAME"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
